<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PED Atlas · era viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { --bg: #F5F3EE; --fg: #1E2229; --line: #DAD6CC; --water: #E9EEF0; --accent: #1F6F78; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181C; --fg: #E8E6E1; --line: #303740; --water: #0F1A22; --accent: #5FB3BC; } }
  body { margin: 0; font: 14px/1.4 -apple-system, 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  select, label { font: inherit; }
  canvas { display: block; width: 100vw; height: calc(100vh - 52px); background: var(--water); cursor: crosshair; }
  #info { margin-left: auto; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <strong>Era viewer</strong>
  <label>Province <select id="prov"></select></label>
  <label>Kind <select id="kind"><option value="full">full</option><option value="overview">overview</option></select></label>
  <label>Era <select id="era"></select></label>
  <label><input type="checkbox" id="all" /> all eras (outline)</label>
  <span id="info"></span>
</header>
<canvas id="c"></canvas>
<script src="vendor/topojson-client.min.js"></script>
<script>
(async () => {
  const dataBase = new URL('data/', location.origin + location.pathname.replace(/[^/]*$/, '')).toString();
  const q = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  // Options are built with DOM nodes; file and property values are data.
  const fillSelect = (sel, vals) => sel.replaceChildren(...vals.map((v) => { const o = document.createElement('option'); o.value = v; o.textContent = v; return o; }));
  const manifest = await (await fetch(dataBase + 'manifest.json')).json();
  const provs = manifest.provinces ?? [];
  fillSelect($('prov'), provs);
  $('prov').value = q.get('prov') && provs.includes(q.get('prov')) ? q.get('prov') : provs[0];
  $('kind').value = q.get('kind') === 'overview' ? 'overview' : 'full';

  let topo = null, eras = [], features = {}, hover = null;
  const hatch = (() => { const o = document.createElement('canvas'); o.width = o.height = 8; const x = o.getContext('2d'); x.strokeStyle = '#B8860B'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 8); x.lineTo(8, 0); x.stroke(); return ctx.createPattern(o, 'repeat'); })();

  async function load() {
    const pr = $('prov').value, kind = $('kind').value;
    const file = kind === 'overview' ? `${pr}.overview.topo.json` : `${pr}.topo.json`;
    const t0 = performance.now();
    topo = await (await fetch(dataBase + 'geo/' + file)).json();
    eras = Object.keys(topo.objects).sort();
    features = {};
    for (const e of eras) features[e] = topojson.feature(topo, topo.objects[e]).features;
    fillSelect($('era'), eras);
    if (q.get('era') && eras.includes(q.get('era'))) $('era').value = q.get('era');
    $('info').textContent = `${file}: ${eras.length} eras, ${topo.arcs.length} arcs, loaded in ${Math.round(performance.now() - t0)} ms`;
    draw();
  }

  function bboxOf(fs) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    const walk = (c) => { if (typeof c[0] === 'number') { if (c[0] < x0) x0 = c[0]; if (c[0] > x1) x1 = c[0]; if (c[1] < y0) y0 = c[1]; if (c[1] > y1) y1 = c[1]; } else c.forEach(walk); };
    for (const f of fs) if (f.geometry) walk(f.geometry.coordinates);
    return [x0, y0, x1, y1];
  }
  let tf = { k: 1, tx: 0, ty: 0 };
  function fit(fs) {
    const [x0, y0, x1, y1] = bboxOf(fs);
    const w = canvas.width, h = canvas.height, pad = 24;
    const k = Math.min((w - 2 * pad) / (x1 - x0), (h - 2 * pad) / (y1 - y0));
    tf = { k, tx: (w - k * (x1 + x0)) / 2, ty: (h + k * (y1 + y0)) / 2 };
  }
  const px = (p) => [tf.k * p[0] + tf.tx, -tf.k * p[1] + tf.ty];
  function path(g) {
    const rings = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    ctx.beginPath();
    for (const poly of rings) for (const ring of poly) ring.forEach((p, i) => { const [x, y] = px(p); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath();
  }
  function draw() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const era = $('era').value; const fs = features[era] ?? [];
    fit(fs);
    const fg = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    if ($('all').checked) {
      ctx.lineWidth = 0.5 * dpr; ctx.strokeStyle = 'rgba(128,128,128,0.35)';
      for (const e of eras) if (e !== era) for (const f of features[e]) { if (f.geometry) { path(f.geometry); ctx.stroke(); } }
    }
    for (const f of fs) {
      if (!f.geometry) continue;
      path(f.geometry);
      const fl = f.properties?.geo_role === 'floterial';
      if (fl) { ctx.fillStyle = hatch; ctx.fill(); ctx.lineWidth = 3 * dpr; ctx.strokeStyle = '#B8860B'; ctx.stroke(); continue; }
      const hov = hover && hover.id === f.id;
      ctx.fillStyle = hov ? '#1F6F78' : `hsl(${(hashId(String(f.id)) % 360)}, 35%, ${fg === '#E8E6E1' ? 38 : 72}%)`;
      ctx.fill(); ctx.lineWidth = 1 * dpr; ctx.strokeStyle = fg === '#E8E6E1' ? '#15181C' : '#FFFFFF'; ctx.stroke();
    }
  }
  function hashId(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
  function inside(pt, ring) { let c = false; for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) { const [xi, yi] = ring[i], [xj, yj] = ring[j]; if (((yi > pt[1]) !== (yj > pt[1])) && (pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi)) c = !c; } return c; }
  function hitTest(pt) {
    const fs = features[$('era').value] ?? []; const out = [];
    for (const f of fs) { const g = f.geometry; if (!g) continue; const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates; for (const poly of polys) { if (inside(pt, poly[0]) && !poly.slice(1).some((h) => inside(pt, h))) { out.push(f); break; } } }
    return out;
  }
  canvas.addEventListener('mousemove', (ev) => {
    const dpr = window.devicePixelRatio || 1;
    const x = ev.offsetX * dpr, y = ev.offsetY * dpr;
    const pt = [(x - tf.tx) / tf.k, (tf.ty - y) / tf.k];
    const hits = hitTest(pt);
    hover = hits.find((f) => f.properties?.geo_role !== 'floterial') ?? hits[0] ?? null;
    $('info').textContent = hits.length ? hits.map((f) => `${f.properties.pedname} [${f.properties.geo_role}] ${Number(f.properties.areakm_net).toLocaleString()} km²`).join('  +  ') : '';
    draw();
  });
  window.addEventListener('resize', draw);
  $('prov').onchange = load; $('kind').onchange = load; $('era').onchange = draw; $('all').onchange = draw;
  await load();
})();
</script>
</body>
</html>
